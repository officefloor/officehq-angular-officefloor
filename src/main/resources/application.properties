# Base app config. See BASE_CHECKLIST.md §B. TODO: verify against the real OfficeFloor-in-Spring setup.

# In-memory H2, in the same JVM; dies with the process (clean per-run reset).
spring.datasource.url=jdbc:h2:mem:app;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Flyway owns the schema; it migrates the empty DB up on boot. Base has no domain migrations.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=none

# Actuator health = the harness readiness probe (config.yaml -> app.health_url).
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# SPA served as static files; the deep-link fallback lives in SpaConfig.java.
# (Static content is built into src/main/resources/static by bin/build.)

